:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {

}

.text-muted {

}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  min-height: 20px;
  align-items: center;
  gap: 6px;

  width: 14px;

  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {

  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:disabled {

.form-switch .form-check-input:disabled,

  height: 20px;

  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-moz-range-track {

}

  height: 20px;

  border-radius: var(--radius-full);

.form-range:disabled {

        const w=pickWindow();
        root.querySelector(&#x27;[data-pick-status]&#x27;).textContent=`Pick ${w.current} · yours at ${w.next}`;
        root.querySelector(&#x27;[data-next-status]&#x27;).textContent=`following pick ${w.after}`;
        root.querySelector(&#x27;[data-drafted-count]&#x27;).textContent=state.drafted.length;
        root.querySelector(&#x27;[data-available-count]&#x27;).textContent=players.length-state.drafted.length;
        root.querySelector(&#x27;[data-undo]&#x27;).disabled=!state.drafted.length;
      }
      function renderRoster(){
        const c=counts();
        const flex=Math.min(1,Math.max(0,c.RB-2)+Math.max(0,c.WR-2)+Math.max(0,c.TE-1));
        const vals={...c,FLEX:flex};
        root.querySelector(&#x27;[data-roster]&#x27;).innerHTML=Object.entries(rosterTargets).map(([pos,target])=&gt;`&lt;div class=&quot;dft-slot&quot;&gt;&lt;span&gt;${pos}&lt;/span&gt;&lt;strong&gt;${vals[pos]||0} / ${target}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      function renderRecommendations(){
        root.querySelector(&#x27;[data-recommendations]&#x27;).innerHTML=recommendationData().map((p,i)=&gt;{
          const e=explain(p), ar=activeRank(p);
          return `&lt;article class=&quot;dft-rec&quot;&gt;&lt;div class=&quot;dft-rechead&quot;&gt;&lt;div class=&quot;dft-recname&quot;&gt;&lt;strong&gt;${i+1}. ${escapeHtml(p.name)}&lt;/strong&gt;&lt;div class=&quot;dft-meta&quot;&gt;${p.pos} · ${p.team} · Tier ${p.tier??&#x27;—&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;dft-call ${e.call.toLowerCase()}&quot;&gt;${e.call}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dft-why&quot;&gt;&lt;span&gt;${escapeHtml(e.reasons[0]||&#x27;&#x27;)}&lt;/span&gt;${e.reasons[1]?`&lt;span&gt;${escapeHtml(e.reasons[1])}&lt;/span&gt;`:&#x27;&#x27;}${e.risk?`&lt;span class=&quot;dft-risk&quot;&gt;${escapeHtml(e.risk)}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;dft-recfoot&quot;&gt;&lt;span class=&quot;dft-ranks&quot;&gt;Decision ${Math.round(p.decision)} · room ${ar??&#x27;—&#x27;}&lt;/span&gt;&lt;div class=&quot;dft-inline-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dft-smallbtn dft-quiet&quot; data-taken=&quot;${p.id}&quot;&gt;Taken&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;dft-smallbtn dft-primary&quot; data-mine=&quot;${p.id}&quot;&gt;Mine&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;`;
        }).join(&#x27;&#x27;);
      }
      function filteredAvailable(){
        const q=root.querySelector(&#x27;[data-search]&#x27;).value.trim().toLowerCase();
        const pos=root.querySelector(&#x27;[data-position]&#x27;).value;
        return players.filter(p=&gt;!draftedSet().has(p.id) &amp;&amp; (pos===&#x27;ALL&#x27;||p.pos===pos) &amp;&amp; (!q||p.name.toLowerCase().includes(q))).sort((a,b)=&gt;scorePlayer(b)-scorePlayer(a));
      }
      function renderLiveTable(){
        const list=filteredAvailable();
        root.querySelector(&#x27;[data-live-table]&#x27;).innerHTML=list.slice(0,state.liveLimit).map(p=&gt;{
          const ar=activeRank(p), or=otherRank(p), gap=ar-p.decision;
          return `&lt;tr&gt;&lt;td class=&quot;num&quot;&gt;${Math.round(p.decision)}&lt;/td&gt;&lt;td class=&quot;dft-playercell&quot;&gt;&lt;strong&gt;${escapeHtml(p.name)}&lt;/strong&gt;&lt;span&gt;${p.pos} · ${p.team} · Tier ${p.tier??&#x27;—&#x27;}&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${ar??&#x27;—&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${or??&#x27;—&#x27;}&lt;/td&gt;&lt;td class=&quot;num dft-gap ${gap&gt;=6?&#x27;good&#x27;:gap&lt;=-6?&#x27;bad&#x27;:&#x27;&#x27;}&quot;&gt;${formatGap(gap)}&lt;/td&gt;&lt;td&gt;${escapeHtml(quickRead(p))}&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;dft-rowactions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dft-smallbtn dft-quiet&quot; data-taken=&quot;${p.id}&quot;&gt;Taken&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;dft-smallbtn&quot; data-mine=&quot;${p.id}&quot;&gt;Mine&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
        }).join(&#x27;&#x27;) || `&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;dft-muted&quot;&gt;No available players match this filter.&lt;/td&gt;&lt;/tr&gt;`;
        root.querySelector(&#x27;[data-show-more-live]&#x27;).hidden=list.length&lt;=state.liveLimit;
      }
      function filteredRankings(){
        const q=root.querySelector(&#x27;[data-rank-search]&#x27;).value.trim().toLowerCase();
        const pos=root.querySelector(&#x27;[data-rank-position]&#x27;).value;
        return [...players].filter(p=&gt;(pos===&#x27;ALL&#x27;||p.pos===pos)&amp;&amp;(!q||p.name.toLowerCase().includes(q))).sort((a,b)=&gt;a.decision-b.decision);
      }
      function renderRankings(){
        const dset=draftedSet(), list=filteredRankings();
        root.querySelector(&#x27;[data-rank-table]&#x27;).innerHTML=list.slice(0,state.rankLimit).map((p,i)=&gt;{
          const cross=p.espn!=null&amp;&amp;p.yahoo!=null?p.yahoo-p.espn:null;
          const read=cross==null?&#x27;Platform comparison unavailable&#x27;:Math.abs(cross)&lt;5?&#x27;Rooms broadly agree&#x27;:cross&gt;0?`ESPN takes him ${cross} earlier`:`Yahoo takes him ${Math.abs(cross)} earlier`;
          return `&lt;tr class=&quot;${dset.has(p.id)?&#x27;dft-drafted&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td class=&quot;num&quot;&gt;${Math.round(p.decision)}&lt;/td&gt;&lt;td class=&quot;dft-playercell&quot;&gt;&lt;strong&gt;${escapeHtml(p.name)}&lt;/strong&gt;&lt;span&gt;${p.pos} · ${p.team}&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${p.lr??&#x27;—&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${p.tier??&#x27;—&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${p.espn??&#x27;—&#x27;}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${p.yahoo??&#x27;—&#x27;}&lt;/td&gt;&lt;td&gt;${escapeHtml(read)}&lt;/td&gt;&lt;/tr&gt;`;
        }).join(&#x27;&#x27;);
        root.querySelector(&#x27;[data-show-more-rank]&#x27;).hidden=list.length&lt;=state.rankLimit;
      }
      function mark(id,isMine){
        if(draftedSet().has(id)) return;
        const p=players.find(x=&gt;x.id===id); if(!p) return;
        state.drafted.push({id}); if(isMine) state.mine.add(id);
        root.querySelector(&#x27;[data-announcer]&#x27;).textContent=`${p.name} marked ${isMine?&#x27;as your pick&#x27;:&#x27;taken&#x27;}.`;
        renderAll();
      }
      function undo(){
        const last=state.drafted.pop(); if(!last) return;
        state.mine.delete(last.id);
        const p=players.find(x=&gt;x.id===last.id);
        root.querySelector(&#x27;[data-announcer]&#x27;).textContent=`Restored ${p?p.name:&#x27;last player&#x27;}.`;
        renderAll();
      }
      function renderAll(){ renderSettings(); renderStatus(); renderRoster(); renderRecommendations(); renderLiveTable(); renderRankings(); }

      root.addEventListener(&#x27;click&#x27;,e=&gt;{
        const b=e.target.closest(&#x27;button&#x27;); if(!b) return;
        if(b.dataset.viewButton){ state.view=b.dataset.viewButton; root.querySelectorAll(&#x27;[data-view-button]&#x27;).forEach(x=&gt;x.setAttribute(&#x27;aria-pressed&#x27;,String(x.dataset.viewButton===state.view))); root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(x=&gt;x.hidden=x.dataset.view!==state.view); }
        if(b.dataset.platform){ state.platform=b.dataset.platform; renderAll(); }
        if(b.hasAttribute(&#x27;data-sources-button&#x27;)){ const s=root.querySelector(&#x27;[data-sources]&#x27;), open=s.hidden; s.hidden=!open; b.setAttribute(&#x27;aria-expanded&#x27;,String(open)); }
        if(b.dataset.taken) mark(b.dataset.taken,false);
        if(b.dataset.mine) mark(b.dataset.mine,true);
        if(b.hasAttribute(&#x27;data-undo&#x27;)) undo();
        if(b.hasAttribute(&#x27;data-show-more-live&#x27;)){ state.liveLimit+=20; renderLiveTable(); }
        if(b.hasAttribute(&#x27;data-show-more-rank&#x27;)){ state.rankLimit+=50; renderRankings(); }
      });
      root.querySelector(&#x27;#dft-teams&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.teams=Number(e.target.value); fillSlotSelect(); renderAll(); });
      root.querySelector(&#x27;#dft-slot&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{ state.slot=Number(e.target.value); renderAll(); });
      root.querySelector(&#x27;[data-search]&#x27;).addEventListener(&#x27;input&#x27;,()=&gt;{ state.liveLimit=16; renderLiveTable(); });
      root.querySelector(&#x27;[data-position]&#x27;).addEventListener(&#x27;change&#x27;,()=&gt;{ state.liveLimit=16; renderLiveTable(); });
      root.querySelector(&#x27;[data-rank-search]&#x27;).addEventListener(&#x27;input&#x27;,()=&gt;{ state.rankLimit=40; renderRankings(); });
      root.querySelector(&#x27;[data-rank-position]&#x27;).addEventListener(&#x27;change&#x27;,()=&gt;{ state.rankLimit=40; renderRankings(); });
      fillSlotSelect();
      renderAll();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

  };

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;

      openTooltip(trigger);
      return;

    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

      if (pinnedByTouch) {

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);

  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
